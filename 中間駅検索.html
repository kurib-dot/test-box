<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中間駅検索システム</title>
  <style>
    :root {
      --primary-color: #4A90E2;
      --bg-color: #F5F7FA;
      --text-color: #333333;
    }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 500px;
      background: #FFFFFF;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 20px;
    }
    .input-group {
      margin-bottom: 15px;
    }
    .input-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .input-group input {
      width: calc(100% - 20px);
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #357ABD;
    }
    #result-area, #loading-area, #error-area {
      display: none;
      margin-top: 20px;
      text-align: center;
    }
    #error-area {
      color: #D8000C;
      background-color: #FFD2D2;
      padding: 10px;
      border-radius: 5px;
    }
    #map {
      width: 100%;
      height: 300px;
      background-color: #e0e0e0;
      border-radius: 5px;
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
    }
    .highlight-station {
      color: #4A90E2;
      font-size: 2rem;
      display: block;
      margin: 10px 0;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📍 中間駅リサーチ (PoC)</h1>
  
  <div class="input-group">
    <label for="station-a">駅A（出発地1）</label>
    <input type="text" id="station-a" placeholder="例：新宿駅">
  </div>
  
  <div class="input-group">
    <label for="station-b">駅B（出発地2）</label>
    <input type="text" id="station-b" placeholder="例：東京駅">
  </div>
  
  <button onclick="searchIntermediateStation()">おすすめの中間駅を探す</button>

  <!-- ローディング表示 -->
  <div id="loading-area">
    <p>候補駅をスコアリング中...<br><small>※APIと通信しているため数秒かかります</small></p>
  </div>

  <!-- エラー表示エリア -->
  <div id="error-area">
    <p id="error-message"></p>
  </div>

  <!-- 結果表示エリア -->
  <div id="result-area">
    <h2>最適なおすすめ中間駅</h2>
    <strong id="result-station" class="highlight-station"></strong>
    <p>
      駅Aからの移動時間(車): <strong id="time-a"></strong><br>
      駅Bからの移動時間(車): <strong id="time-b"></strong>
    </p>
    
    <!-- 地図・周辺スポット表示用プレースホルダー -->
    <div id="map">Google Maps 描画エリア (拡張待ち)</div>
  </div>
</div>

<script>
  function searchIntermediateStation() {
    const stationA = document.getElementById('station-a').value;
    const stationB = document.getElementById('station-b').value;

    if (!stationA || !stationB) {
      alert('駅Aと駅Bの両方を入力してください。');
      return;
    }

    // UI状態の切り替え（ローディング表示）
    document.getElementById('result-area').style.display = 'none';
    document.getElementById('error-area').style.display = 'none';
    document.getElementById('loading-area').style.display = 'block';

    // GASバックエンド処理（中間駅スコアリング）を呼び出す
    google.script.run
      .withSuccessHandler(function(result) {
        document.getElementById('loading-area').style.display = 'none';
        
        if (result.success) {
          // 成功した場合：結果エリアに最適駅とそれぞれの時間を表示
          document.getElementById('result-station').innerText = result.bestStation;
          document.getElementById('time-a').innerText = result.details.timeA_Text;
          document.getElementById('time-b').innerText = result.details.timeB_Text;
          document.getElementById('result-area').style.display = 'block';
        } else {
          // API側でエラーになった場合：エラーエリアに詳細を表示
          document.getElementById('error-message').innerText = result.error;
          document.getElementById('error-area').style.display = 'block';
        }
      })
      .withFailureHandler(function(error) {
        // 通信自体が失敗した場合
        document.getElementById('loading-area').style.display = 'none';
        document.getElementById('error-message').innerText = 'システム通信エラー: ' + error.message;
        document.getElementById('error-area').style.display = 'block';
      })
      .findIntermediateStation(stationA, stationB);
  }
</script>

</body>
</html>
